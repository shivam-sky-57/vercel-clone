spring.application.name=s3-reverse-proxy
server.port=${PORT:${SERVER_PORT:8000}}

# Optional import for private local credentials (Ignored by .gitignore)
spring.config.import=optional:classpath:application-secret.properties,optional:file:./application-secret.properties,optional:file:../application-secret.properties

# Base URL to S3 bucket outputs (Defaults to environment variables)
s3.bucket.name=${S3_BUCKET_NAME:}
aws.region=${AWS_REGION:ap-south-1}
s3.base.url=${S3_BASE_URL:}
