spring.application.name=build-server

spring.config.import=optional:classpath:application-secret.properties,optional:file:./application-secret.properties,optional:file:../application-secret.properties

aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.endpoint=${AWS_ENDPOINT:}
s3.bucket.name=${S3_BUCKET_NAME:}

redis.url=${REDIS_URL:redis://localhost:6379}

build.workspace.dir=${BUILD_WORKSPACE_DIR:/app/output}
