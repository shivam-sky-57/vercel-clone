spring.application.name=api-server
server.port=9000

# AWS Configuration (Read strictly from Environment Variables)
aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# ECS Cluster & Task Definition
aws.ecs.cluster=${AWS_ECS_CLUSTER:vercel-cluster}
aws.ecs.task-definition=${AWS_ECS_TASK_DEFINITION:vercel-build-task}
aws.ecs.subnets=${AWS_ECS_SUBNETS:}
aws.ecs.security-groups=${AWS_ECS_SECURITY_GROUPS:}
aws.ecs.container-name=${AWS_ECS_CONTAINER_NAME:vercel-builder}

# S3 Bucket Output
s3.bucket.name=${S3_BUCKET_NAME:vercel-clone-outputs}

# Redis Pub/Sub Configuration for Real-time Logs
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Base URL template for preview URLs
app.proxy.base-url=${PROXY_BASE_URL:http://%s.localhost:8000}
